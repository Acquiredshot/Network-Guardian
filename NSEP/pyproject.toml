[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-event-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "pika>=1.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "requests>=2.32,<3",
  "redis>=5.2",
  "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
pythonpath = ["services/ingestion-api", "services/security-workers", "services"]

[tool.setuptools]
packages = []
