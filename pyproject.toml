[build-system]
requires = ["setuptools>=68.0,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-guardian"
version = "0.2.0"
description = "Autonomous network auditing and system monitoring assistant"
authors = [{name = "Wolf-Pak Innovations LLC", email = "legal@wolfpakinnovations.com"}]
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
keywords = ["network", "security", "monitoring", "IDS", "IPS", "threat-detection", "wolf-pak"]
dependencies = [
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0",
    "psycopg>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
]
remote = [
    "cmdop>=0.1",
    "cmdop-bot>=0.1",
    "openclaw>=2026.3",
    "twilio>=9.0,<10",
]

# Dependency integrity: install with `pip install --require-hashes -r requirements.lock`
# Lock file contains sha256 hashes for all pinned dependencies.

[project.scripts]
network-guardian = "network_guardian.__main__:main"
ng-probe = "network_guardian.agent.probe:main"
ng-build-agent = "network_guardian.agent.build:main"
# Wolfpak admin CLI tools
ng-fleet = "network_guardian.wolfpak.ng_fleet:main"
ng-ids = "network_guardian.wolfpak.ng_ids:main"
ng-status = "network_guardian.wolfpak.ng_status:main"

[tool.setuptools.packages.find]
include = ["network_guardian*"]

[tool.setuptools.package-data]
network_guardian = ["saas/migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

